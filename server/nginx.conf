# NOTE: This example serves plain HTTP for LAN/dev use. For any
# internet-facing deployment, terminate TLS instead — clients warn on
# non-HTTPS sources because index + zips are unauthenticated in transit:
#   listen 443 ssl;
#   ssl_certificate     /etc/letsencrypt/live/<host>/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/<host>/privkey.pem;
server {
    listen 80;
    server_name _;

    root /srv/live2d-models;

    location / {
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
        types {
            application/zip zip;
            application/json json;
        }
    }

    location = /index.json {
        add_header Cache-Control "no-cache";
        default_type application/json;
    }
}

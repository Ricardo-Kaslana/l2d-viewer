name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee test-output.log
      - name: Report skipped coverage
        if: always()
        shell: bash
        run: |
          ignored=$(grep -cE '\.\.\. ignored' test-output.log || true)
          skipped=$(grep -ciE 'skip:' test-output.log || true)
          echo "::notice::ignored=${ignored:-0} printed-skips=${skipped:-0}; model/GPU tests are not CI rendering coverage"
      - run: cargo test -p mocari_host --example render_poc
      - run: cargo test --manifest-path third_party/mocari/Cargo.toml --lib
      - run: cargo check -p mocari_host --example bare_triangle

  rust-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - run: cargo check --workspace --all-targets

  flutter-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.5"
          cache: true
      - run: cd app && flutter pub get --enforce-lockfile
      - name: Reject environment-specific lockfile mirrors
        run: |
          if grep -q 'mirrors.cloud.tencent.com' app/pubspec.lock; then
            echo "::error::pubspec.lock must resolve from pub.dev"
            exit 1
          fi
      - run: cd app && dart format --output=none --set-exit-if-changed lib test tool
      - run: cd app && flutter analyze
      - run: cd app && flutter test

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.5"
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
      - name: Export NDK path
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - run: cd app && flutter pub get --enforce-lockfile
      - name: Cross-compile Rust for arm64
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
        run: cargo build -p mocari_host --target aarch64-linux-android --release
      - name: Stage libmocari_host.so
        working-directory: app
        run: dart run tool/stage_android_libs.dart
      - run: cd app && flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: live2d-viewer-android-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  windows-build:
    # Flutter 3.35.5 only maps VS 17 to the 2022 generator; windows-latest
    # now ships VS 18, which Flutter mis-selects as VS 2019.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.5"
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - run: flutter config --enable-windows-desktop
      - run: cd app && flutter pub get --enforce-lockfile
      - run: cd app && flutter build windows --release
      - name: Package Windows release
        shell: pwsh
        run: |
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, third_party/mocari/LICENSE `
            -Destination app/build/windows/x64/runner/Release/
          Compress-Archive -Path app/build/windows/x64/runner/Release/* `
            -DestinationPath Live2DViewer-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: live2d-viewer-windows-x64
          path: Live2DViewer-windows-x64.zip
          if-no-files-found: error

  frb-codegen-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.5"
          cache: true
      - run: cd app && flutter pub get --enforce-lockfile
      - run: cargo install flutter_rust_bridge_codegen --version 2.9.0 --locked
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Regenerate FRB bindings
        run: |
          flutter_rust_bridge_codegen generate \
            -r "crate::frb_api" \
            -d "app/lib/src/rust" \
            --rust-root "crates/mocari_host" \
            --dart-root "app"
      - name: Check generated files are in sync
        run: |
          git add -N crates/mocari_host/src/frb_generated.rs app/lib/src/rust/
          if ! git diff --exit-code -- \
              crates/mocari_host/src/frb_generated.rs \
              app/lib/src/rust/; then
            echo "::error::FRB generated files are out of sync."
            exit 1
          fi

  license-and-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check public tree contents
        run: bash scripts/check-public-tree.sh
      - name: Check workspace licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources
          manifest-path: Cargo.toml
      - name: Check vendored Mocari licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources
          manifest-path: third_party/mocari/Cargo.toml

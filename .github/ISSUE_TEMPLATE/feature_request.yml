name: Feature request
description: Suggest a focused improvement to Live2D Viewer.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Windows
        - Android
        - Both
        - Rendering/runtime
        - Documentation/build
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This request does not require bundling unlicensed model assets.
          required: true
        - label: I understand this is an unofficial project and not affiliated with Live2D Inc.
          required: true

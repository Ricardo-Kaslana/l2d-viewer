# Group routine minor/patch updates. Rendering, platform, and code-generation
# dependencies stay on manual upgrades.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Keep the runtime in lockstep with the pinned FRB codegen (2.9.0).
      - dependency-name: "flutter_rust_bridge"
      # Rendering and Android platform crates are upgraded manually.
      - dependency-name: "wgpu"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "wgpu-types"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "ndk"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "ndk-context"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "ndk-sys"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "pollster"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # Pub version updates are intentionally manual: Dependabot resolves without
  # the pinned Flutter SDK, so the resulting lockfile fails --enforce-lockfile.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
